<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b2a41">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Pula Corda</title>
<style>
:root{--bg:#1b2a41;--fg:#f4f4f4;--card:rgba(255,255,255,.14);--ac:#ff7a3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation}
.scr{position:fixed;inset:0;display:none;flex-direction:column;gap:10px;padding:max(env(safe-area-inset-top),12px) 14px max(env(safe-area-inset-bottom),12px)}
.scr.on{display:flex}
button{font:inherit;color:inherit;border:0;border-radius:14px;background:var(--card);padding:12px 14px;min-height:48px;cursor:pointer}
button:active{transform:scale(.97)}
button:disabled{opacity:.4}
button.pri{background:var(--ac);color:#fff;font-weight:700}
h1{margin:0;font-size:2.2rem;text-align:center}
h2{margin:0;font-size:1.3rem;flex:1}
.top{display:flex;align-items:center;gap:10px}
.top button{min-width:48px}
.chip{background:var(--card);border-radius:20px;padding:6px 14px;font-weight:700}
.col{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px}
.card .t{flex:1;min-width:0}
.card small{display:block;opacity:.8;margin-top:2px}
.card button{flex:0 0 auto;min-width:92px}
.bar{height:6px;border-radius:3px;background:var(--card);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
#menu{justify-content:center;align-items:stretch;gap:14px}
#menu .row{display:flex;gap:8px;justify-content:center}
#menu .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
#play{font-size:1.5rem;padding:18px}
#game,#box{padding:0;gap:0}
#hud,#bhud{display:flex;justify-content:space-between;align-items:center;padding:max(env(safe-area-inset-top),8px) 14px 4px;font-weight:700}
#hs,#bn{font-size:2.6rem;line-height:1}
#cw,#bcw{position:relative;flex:1;min-height:0}
#cv,#bv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#msg,#bmsg{position:absolute;inset:0;display:flex;justify-content:center;padding:10% 20px 0;font-size:1.2rem;font-weight:700;text-align:center;pointer-events:none}
#over,#bover{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.55);color:#fff;text-align:center}
#over button,#bover button{width:220px}
#ovScore{font-size:4rem;font-weight:800;line-height:1}
#abs,#bbar{display:flex;gap:8px;padding:8px 12px max(env(safe-area-inset-bottom),10px)}
#abs button,#bbar button{flex:1;min-height:60px;padding:6px;line-height:1.25}
#abs button small,#bbar button small{display:block;opacity:.85;font-size:.75rem}
#abs button.rdy{background:var(--ac);color:#fff}
#abs button.act{outline:3px solid var(--ac)}
#abs #bQuit{flex:0 0 54px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sk button{border-radius:10px;overflow:hidden}.sk img{width:100%;height:100%;display:block;object-fit:contain;image-rendering:pixelated}
.sw button{width:44px;min-width:44px;height:44px;min-height:44px;border-radius:50%;padding:0;border:3px solid var(--card)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
#modal div{background:#fff;color:#1a1a2e;border-radius:18px;padding:18px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:12px}
#modal .r{display:flex;gap:8px}
#modal .r button{flex:1;background:#e6e6ee;color:#1a1a2e}
#modal .r button.pri{background:var(--ac);color:#fff}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:10;max-width:90%;text-align:center}
h3{margin:8px 0 0;font-size:1rem;opacity:.85}
.stb{display:block;width:100%;text-align:left}.stb small{display:block;opacity:.8;margin-top:2px}.stb.sel{outline:3px solid var(--ac)}
#nt{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:11;max-width:92%;text-align:center;pointer-events:none}
.big{font-size:3rem;font-weight:800;line-height:1}
#bbar button{min-height:64px;font-weight:700}#bbar #bbQuit{flex:0 0 54px}
@media (max-height:520px){h1{font-size:1.6rem}#play{padding:10px}#hs{font-size:2rem}}
</style>
</head>
<body>

<section id="menu" class="scr on">
  <h1>🪢 Pula Corda</h1>
  <div class="row"><span class="chip" id="mCoins"></span><span class="chip" id="mBest"></span></div>
  <button class="pri" id="play" data-go="game">▶ Jogar</button>
  <button class="pri" data-go="box" style="font-size:1.3rem;padding:14px">🥊 Boxe</button>
  <div class="grid">
    <button data-go="shop">🛒<br>Loja</button>
    <button data-go="chal">🎯<br>Desafios</button>
    <button data-go="ach">🏆<br>Conquistas</button>
    <button data-go="set">⚙️<br>Config.</button>
  </div>
</section>

<section id="game" class="scr">
  <div id="hud"><span id="hc"></span><b id="hs">0</b><span id="hr"></span></div>
  <div id="cw">
    <canvas id="cv"></canvas>
    <div id="msg"></div>
    <div id="over">
      <h2 id="ovTitle" style="flex:none">Errou!</h2>
      <div id="ovScore">0</div>
      <div id="ovInfo"></div>
      <button class="pri" id="again">Jogar de novo</button>
      <button data-go="menu">Menu</button>
    </div>
  </div>
  <div id="abs">
    <button id="bSlow"></button>
    <button id="bAuto"></button>
    <button id="bQuit" aria-label="Sair">✕</button>
  </div>
</section>

<section id="box" class="scr">
  <div id="bhud"><span id="bt"></span><b id="bn">0</b><span id="bc"></span></div>
  <div id="bcw"><canvas id="bv"></canvas><div id="bmsg"></div><div id="bover"></div></div>
  <div id="bbar">
    <button data-mv="jab">👊<small>Jab</small></button>
    <button data-mv="direto">➡️<small>Direto</small></button>
    <button data-mv="cruzado">↪️<small>Cruzado</small></button>
    <button data-mv="gancho">⤴️<small>Gancho</small></button>
    <button id="bbQuit" aria-label="Sair">✕</button>
  </div>
</section>

<section id="bshop" class="scr">
  <div class="top"><button data-go="shop">←</button><h2>Equipamentos</h2><span class="chip" id="bsCoins"></span></div>
  <div class="col" id="bsList"></div>
</section>

<section id="shop" class="scr">
  <div class="top"><button data-go="menu">←</button><h2>Loja</h2><span class="chip" id="shopCoins"></span></div>
  <div class="col" id="shopList"></div>
</section>

<section id="chal" class="scr">
  <div class="top"><button data-go="menu">←</button><h2>Desafios</h2><span class="chip" id="chalCoins"></span></div>
  <div class="col" id="chalList"></div>
</section>

<section id="ach" class="scr">
  <div class="top"><button data-go="menu">←</button><h2>Conquistas</h2><span class="chip" id="achCount"></span></div>
  <div class="col" id="achList"></div>
</section>

<section id="set" class="scr">
  <div class="top"><button data-go="menu">←</button><h2>Configurações</h2></div>
  <div class="col">
    <div class="card"><div class="t">Sons</div><button id="sndBtn"></button></div>
    <div class="card" style="flex-direction:column;align-items:stretch">
      <div>Cor do fundo</div>
      <div class="sw" id="swatches"></div>
      <button id="bgPick"></button><input type="color" id="bgIn" hidden>
    </div>
    <div class="card" style="flex-direction:column;align-items:stretch">
      <div>Skin do personagem</div>
      <div class="sw sk" id="skinList"></div>
      <button id="skinAdd">🖼️ Adicionar skin (imagem) — 🪙 500</button>
      <button id="skinDel" style="display:none">🗑️ Remover skin atual</button>
      <input type="file" id="skinIn" accept="image/*" hidden>
    </div>
    <div class="card" style="flex-direction:column;align-items:stretch">
      <div>Estilo de pulo <small>(só muda a animação)</small></div>
      <div id="styleList" style="display:flex;flex-direction:column;gap:6px"></div>
    </div>
  </div>
</section>

<div id="modal"><div><span id="mTxt"></span><span class="r"><button id="mNo">Cancelar</button><button class="pri" id="mYes">Confirmar</button></span></div></div>
<div id="toast"></div>
<div id="nt"></div>

<script>
'use strict';
/* ===== Configuração (ajuste aqui o equilíbrio do jogo) ===== */
const CFG={
  baseCoins:30, coinStep:10,          // moedas por pulo: 30 + 10 por nível
  lvlCosts:[1500,3000,5500,8500,14000], maxLvl:5,               // melhoria de velocidade
  baseRps:.85, rpsStep:.1,            // voltas da corda por segundo (nível 0 → 5: .85 → 1.35)
  slowCost:4000, slowDur:30, slowCd:60, slowMult:.62,   // Slow: corda a 62% da velocidade
  autoCost:2500, autoJumps:15, autoCd:40,
  resetFee:2000,
  jumpDur:.5,                         // duração de um pulo (s)
  clear:.4                            // altura mínima (fração do pulo máximo) para livrar a corda
};

/* ===== Desafios: para criar novos, basta adicionar uma linha ===== */
const CHALLENGES=[
  {id:'r10', name:'Aquecimento',   desc:'10 pulos em uma rodada',  goal:10,   reward:150,  val:s=>s.best},
  {id:'r20', name:'Pegando ritmo', desc:'20 pulos em uma rodada',  goal:20,   reward:300, val:s=>s.best},
  {id:'r50', name:'Sem tropeçar',  desc:'50 pulos em uma rodada',  goal:50,   reward:750, val:s=>s.best},
  {id:'r100',name:'Mestre da corda',desc:'100 pulos em uma rodada',goal:100,  reward:1500, val:s=>s.best},
  {id:'t500',name:'Maratona',      desc:'500 pulos no total',      goal:500,  reward:1000, val:s=>s.total},
  {id:'t2000',name:'Lenda',        desc:'2000 pulos no total',     goal:2000, reward:2500, val:s=>s.total},
  {id:'p10', name:'Persistente',   desc:'Jogar 10 rodadas',        goal:10,   reward:400, val:s=>s.rounds}
];

/* ===== Skins: o personagem é desenhado por uma skin.
   No app Android, skins baixadas/criadas entram com registerSkin({id,name,color,draw?}) ===== */
const SKINS={default:{id:'default',name:'Quadrado',color:'#ff7a3d',
  draw(c,x,y,s,sk){c.fillStyle=sk.color;c.fillRect(x-s/2,y-s,s,s);
    c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=2;c.strokeRect(x-s/2,y-s,s,s);
    c.fillStyle='#fff';const e=s*.12;c.fillRect(x-s*.22,y-s*.68,e,e*1.6);c.fillRect(x+s*.1,y-s*.68,e,e*1.6)}}};
function registerSkin(sk){if(sk&&sk.id)SKINS[sk.id]=sk}
[['azul','Azul','#3b82f6'],['verde','Verde','#22c55e'],['rosa','Rosa','#ec4899'],['roxo','Roxo','#8b5cf6'],['ouro','Ouro','#facc15'],['branco','Branco','#f5f5f5']]
  .forEach(a=>registerSkin({id:a[0],name:a[1],color:a[2]}));
function regCustom(c){                       // skin feita de imagem (guardada no aparelho)
  const im=new Image();im.src=c.img;
  registerSkin({id:c.id,name:c.name,color:'#888',custom:true,img:im,pixel:!!c.pixel,
    draw(g,x,y,s,sk){                        // mantém a proporção; pixel art fica nítida
      const m=sk.img;
      if(m.complete&&m.naturalWidth){
        const k=Math.min(s/m.naturalWidth,s*1.3/m.naturalHeight),w=m.naturalWidth*k,hh=m.naturalHeight*k;
        g.imageSmoothingEnabled=!sk.pixel;g.drawImage(m,x-w/2,y-hh,w,hh);g.imageSmoothingEnabled=true;
      }else SKINS.default.draw(g,x,y,s,sk);
    }});
}

/* ===== Estilos de pulo: só mudam a animação (fx) e nunca dão vantagem.
   Para criar outro, adicione uma linha: at = pulos totais para desbloquear ===== */
const STYLES=[
  {id:'basico',    name:'Pulo básico',      at:0},
  {id:'alternado', name:'Pulo alternado',   at:50,  fx(c,t,n){c.rotate((n%2?1:-1)*.2*Math.sin(Math.PI*t))}},
  {id:'unilateral',name:'Pulo unilateral',  at:100, fx(c,t){const k=Math.sin(Math.PI*t);c.rotate(-.22*k);c.scale(1,1-.12*k)}},
  {id:'lateral',   name:'Pulo lateral',     at:150, fx(c,t,n,s){c.translate((n%2?1:-1)*s*.35*Math.sin(Math.PI*t),0)}},
  {id:'tesoura',   name:'Pulo tesoura',     at:200, fx(c,t){const k=Math.sin(Math.PI*t);c.scale(1+.3*k,1-.15*k)}},
  {id:'tras',      name:'Pulo para trás',   at:300, fx(c,t){c.scale(-1,1);c.rotate(.2*Math.sin(Math.PI*t))}},
  {id:'corrida',   name:'Pulo corrida',     at:400, fx(c,t){c.rotate(.12+.12*Math.sin(4*Math.PI*t))}},
  {id:'cruzado',   name:'Pulo cruzado',     at:500, fx(c,t){c.rotate(2*Math.PI*t)}}
];

/* ===== Conquistas: val/goal = progresso numérico; as sem val são liberadas por evento no jogo ===== */
const ACH=[
  {id:'primeiro',    cat:'Iniciantes',     name:'Primeiro pulo',     desc:'Fazer 1 pulo',                       goal:1,   val:s=>s.total},
  {id:'comecando',   cat:'Iniciantes',     name:'Começando',         desc:'Fazer 10 pulos em uma rodada',       goal:10,  val:s=>s.best},
  {id:'ritmo',       cat:'Iniciantes',     name:'Pegando o ritmo',   desc:'Fazer 20 pulos em uma rodada',       goal:20,  val:s=>s.best},
  {id:'persistente', cat:'Iniciantes',     name:'Persistente',       desc:'Jogar 5 partidas',                   goal:5,   val:s=>s.rounds},
  {id:'dinheiro',    cat:'Iniciantes',     name:'Primeiro dinheiro', desc:'Acumular 300 moedas',                goal:300, val:s=>s.coins},
  {id:'aquecendo',   cat:'Intermediárias', name:'Aquecendo',         desc:'Fazer 50 pulos em uma rodada',       goal:50,  val:s=>s.best},
  {id:'semtropecar', cat:'Intermediárias', name:'Sem tropeçar',      desc:'Fazer 100 pulos em uma rodada',      goal:100, val:s=>s.best},
  {id:'colecionador',cat:'Intermediárias', name:'Colecionador',      desc:'Acumular 1.000 moedas',              goal:1000,val:s=>s.coins},
  {id:'dedicado',    cat:'Intermediárias', name:'Dedicado',          desc:'Jogar 25 partidas',                  goal:25,  val:s=>s.rounds},
  {id:'evoluindo',   cat:'Intermediárias', name:'Evoluindo',         desc:'Comprar 3 níveis de velocidade',     goal:3,   val:s=>s.lvl},
  {id:'slow10',      cat:'Especiais',      name:'Na hora certa',     desc:'Usar o Slow e fazer 10 pulos durante o efeito'},
  {id:'auto15',      cat:'Especiais',      name:'Piloto automático', desc:'Completar os 15 pulos do Auto-jump'},
  {id:'velmax',      cat:'Especiais',      name:'Velocidade máxima', desc:'Comprar todos os níveis de velocidade',goal:5, val:s=>s.lvl},
  {id:'superacao',   cat:'Especiais',      name:'Superação',         desc:'Bater o próprio recorde 5 vezes',    goal:5,   val:s=>s.recBreaks},
  {id:'mestre',      cat:'Especiais',      name:'Mestre da corda',   desc:'Acumular 500 pulos no total',        goal:500, val:s=>s.total}
];

/* ===== Preços de personalização (skins e fundos; estilos de pulo desbloqueiam por pulos) ===== */
const SKINP={azul:200,verde:200,rosa:200,roxo:300,branco:300,ouro:1200},IMGP=500,BGP=150,PICKP=750;
const BGS=['#1b2a41','#0f766e','#4c1d95','#7f1d1d','#14532d','#fef3c7','#e0f2fe','#f5f5f4'];

/* ===== Boxe: tudo custa moedas, exceto o equipamento inicial (preço 0).
   gl/bag: [id,nome,cor,preço(,padrão])  fx/sp: [id,nome,preço] ===== */
const BX={time:60,gap:.2,base:[12,14,16,19,22,26],pcost:[1200,2500,4500,7500,12000],
  gl:[['vermelha','Luva vermelha','#dc2626',0],['azul','Luva azul','#2563eb',250],['verde','Luva verde','#16a34a',250],['amarela','Luva amarela','#facc15',450],['preta','Luva preta','#3f3f46',600],['rosa','Luva rosa','#ec4899',750],['dourada','Luva dourada','#eab308',2000]],
  bag:[['lona','Saco de lona','#8b5a2b',0,''],['azul','Saco azul','#2563eb',350,''],['vermelho','Saco vermelho','#dc2626',350,''],['listrado','Saco listrado','#16a34a',750,'s'],['estrelas','Saco estrelado','#7c3aed',1250,'*'],['ouro','Saco dourado','#eab308',2500,'g']],
  fx:[['simples','Impacto simples',0],['faiscas','Faíscas',500],['estrelas','Estrelas',1000],['chamas','Chamas',1750]],
  sp:[['nenhuma','Sem animação especial',0],['tremor','Tremor de tela',750],['giro','Saco giratório nos combos',1500]]};
const BCAT={gl:'Luvas',bag:'Sacos de pancada',fx:'Efeitos dos golpes',sp:'Animações especiais'};
// d = duração do golpe (s), ht = instante em que acerta o saco
const MOVES={jab:{i:1.4,u:0,tw:0,d:.16,ht:.06},direto:{i:2.8,u:0,tw:0,d:.24,ht:.10},cruzado:{i:3.3,u:.1,tw:1,d:.30,ht:.13},gancho:{i:2.4,u:1.2,tw:0,d:.34,ht:.17}};
// combos: sequência de golpes (até 0,9 s entre eles) + moedas de bônus. Para criar outro, adicione uma linha.
const COMBOS=[
  {n:'1-2-3',s:['jab','direto','cruzado'],b:10},{n:'1-1-2',s:['jab','jab','direto'],b:8},
  {n:'Gancho final',s:['jab','cruzado','gancho'],b:12},{n:'Cruzada dupla',s:['cruzado','cruzado','gancho'],b:12},
  {n:'Chuva',s:['jab','jab','jab','jab'],b:8}
].sort((a,b)=>b.s.length-a.s.length);

/* ===== Salvamento ===== */
const KEY='puloCorda_v1';
const DEF={coins:0,best:0,total:0,rounds:0,lvl:0,slow:false,auto:false,done:{},sound:true,bg:'#1b2a41',skin:'default',custom:[],ach:{},style:'basico',styles:{},recBreaks:0,
  own:{},bxBest:0,bxTotal:0,bxPow:0,bxOwn:{},bxEq:{gl:'vermelha',bag:'lona',fx:'simples',sp:'nenhuma'}};
function load(){
  let o={};try{o=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
  const s=Object.assign({},DEF,o);
  s.custom=Array.isArray(o.custom)?o.custom.filter(c=>c&&typeof c.img==='string'&&c.id):[];
  s.cd=Object.assign({slow:0,auto:0},o.cd);s.done=Object.assign({},o.done);
  ['coins','best','total','rounds','lvl'].forEach(k=>s[k]=Math.max(0,Number(s[k])||0));
  s.lvl=Math.min(CFG.maxLvl,s.lvl|0);
  s.ach=Object.assign({},o.ach);s.styles=Object.assign({},o.styles);s.recBreaks=Math.max(0,Number(s.recBreaks)||0);
  if(!STYLES.some(x=>x.id===s.style&&s.total>=x.at))s.style='basico';
  s.bxEq=Object.assign({gl:'vermelha',bag:'lona',fx:'simples',sp:'nenhuma'},o.bxEq);s.bxOwn=Object.assign({},o.bxOwn);
  s.bxBest=Math.max(0,Number(s.bxBest)||0);s.bxTotal=Math.max(0,Number(s.bxTotal)||0);s.bxPow=Math.min(BX.pcost.length,Math.max(0,Number(s.bxPow)|0));
  s.own=Object.assign({},o.own);                      // itens comprados; quem já usava algo antes mantém
  if(!o.own){s.own['skin:'+s.skin]=1;s.own['bg:'+s.bg]=1;s.custom.forEach(c=>s.own['skin:'+c.id]=1);if(BGS.indexOf(s.bg)<0)s.own.picker=1}
  s.own['skin:default']=1;s.own['bg:#1b2a41']=1;
  const n=Date.now();
  if(s.cd.slow>n+CFG.slowCd*1000)s.cd.slow=0;
  if(s.cd.auto>n+CFG.autoCd*1000)s.cd.auto=0;
  return s;
}
let S=load();
S.custom.forEach(regCustom);
if(!SKINS[S.skin])S.skin='default';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ===== Utilidades ===== */
const $=id=>document.getElementById(id);
const PI2=Math.PI*2;
const reward=()=>CFG.baseCoins+CFG.coinStep*S.lvl;
const rps=()=>CFG.baseRps+CFG.rpsStep*S.lvl;
const phase=th=>((th+Math.PI)%PI2+PI2)%PI2;
let FG='#f4f4f4';
function applyTheme(){
  const h=S.bg.replace('#','');
  const n=parseInt(h.length===3?h.replace(/./g,'$&$&'):h,16)||0;
  const l=(.299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255))/255;
  FG=l>.6?'#1a1a2e':'#f4f4f4';
  const r=document.documentElement.style;
  r.setProperty('--bg',S.bg);r.setProperty('--fg',FG);

let AC;
function beep(f,d,type,v,t0){
  if(!S.sound)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(t0||0);
    o.type=type||'square';o.frequency.value=f;
    g.gain.setValueAtTime(v||.07,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
const sfx={
  jump:n=>beep(520+(n%8)*45,.09,'square',.06),
  buy:()=>{beep(520,.1,'triangle',.12);beep(780,.16,'triangle',.12,.09)},
  fail:()=>beep(110,.35,'sawtooth',.1),
  punch:()=>beep(110+Math.random()*50,.07,'sawtooth',.09)
};

const G={on:false,state:'ready',th:0,score:0,earned:0,newRec:false,air:false,jt:0,h:0,wait:0,slowJumps:0,jn:0,prevBest:0,
  slowT:0,autoOn:false,autoLeft:0,pops:[],paused:false,overT:0,last:0,raf:0};
let cv,ctx,W=300,H=400;

function resize(){
  const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);
  W=r.width||300;H=r.height||400;
  cv.width=Math.round(W*d);cv.height=Math.round(H*d);

function setMsg(t){const m=$('msg');m.textContent=t;m.style.display=t?'flex':'none'}
function hud(){$('hs').textContent=G.score;$('hc').textContent='🪙 '+S.coins;$('hr').textContent='🏆 '+S.best}

function startRound(){
  cancelAnimationFrame(G.raf);
  Object.assign(G,{state:'ready',th:0,score:0,earned:0,newRec:false,air:false,jt:0,h:0,wait:0,slowJumps:0,jn:0,prevBest:S.best,
    slowT:0,autoOn:false,autoLeft:0,pops:[],paused:false,overT:0,on:true});
  $('over').style.display='none';
  setMsg('Toque na tela para começar');
  resize();hud();
  G.last=performance.now();
  G.raf=requestAnimationFrame(loop);
}
function endEffect(k){
  if(k==='slow'){G.slowT=0;S.cd.slow=Date.now()+CFG.slowCd*1000}
  else{G.autoOn=false;G.autoLeft=0;S.cd.auto=Date.now()+CFG.autoCd*1000}
  save();
}
function useSlow(){
  if(!S.slow||G.state!=='play'||G.slowT>0||Date.now()<S.cd.slow)return;
  G.slowT=CFG.slowDur;G.slowJumps=0;
}
function useAuto(){
  if(!S.auto||G.state!=='play'||G.autoOn||Date.now()<S.cd.auto)return;
  G.autoOn=true;G.autoLeft=CFG.autoJumps;
}
function jump(){if(!G.air){G.air=true;G.jt=0;G.jn++}}
function tap(){
  if(!G.on||G.state==='over')return;
  if(G.paused){G.paused=false;setMsg('');return}
  if(G.state==='ready'){G.state='play';G.th=0;G.wait=.6;setMsg('');return}
  if(!G.autoOn)jump();
}
function stepJump(dt){
  if(!G.air)return;
  G.jt+=dt/CFG.jumpDur;
  if(G.jt>=1){G.air=false;G.jt=0;G.h=0}else G.h=4*G.jt*(1-G.jt);
}
function cross(k){
  if(G.h>=CFG.clear){
    const rw=reward();
    G.score++;G.earned+=rw;S.coins+=rw;S.total++;
    if(G.score>S.best){S.best=G.score;G.newRec=true}
    G.pops.push({t:0,txt:'+'+rw});
    sfx.jump(G.score);
    if(G.slowT>0&&++G.slowJumps>=10)unlock('slow10');
    if(G.autoOn&&G.autoLeft===0){unlock('auto15');endEffect('auto')}
    checkStyles();checkAch();
    save();hud();
  }else{
    G.th=PI2*k-Math.PI;            // corda parada embaixo, nos pés
    finish(false);
  }
}
function finish(quit){
  if(G.state==='over')return;
  G.state='over';
  if(G.slowT>0)endEffect('slow');
  if(G.autoOn)endEffect('auto');
  S.rounds++;if(G.newRec&&G.prevBest>0)S.recBreaks++;checkAch();save();hud();
  if(!quit){sfx.fail();G.overT=.45}
}
const NQ=[];let nBusy=false;
function notify(m){NQ.push(m);if(!nBusy)nextN()}
function nextN(){const m=NQ.shift(),e=$('nt');if(!m){nBusy=false;e.style.display='none';return}
  nBusy=true;e.textContent=m;e.style.display='block';setTimeout(nextN,2400)}
function unlock(id){
  if(S.ach[id])return;
  const a=ACH.find(x=>x.id===id);if(!a)return;
  S.ach[id]=1;save();sfx.buy();notify('🏆 Conquista: '+a.name);
}
function checkAch(){ACH.forEach(a=>{if(a.val&&!S.ach[a.id]&&a.val(S)>=a.goal)unlock(a.id)})}
function checkStyles(){STYLES.forEach(x=>{if(x.at>0&&S.total>=x.at&&!S.styles[x.id]){S.styles[x.id]=1;notify('🆕 Novo estilo de pulo: '+x.name+' (em Config.)')}})}
function claimable(){return CHALLENGES.some(c=>!S.done[c.id]&&c.val(S)>=c.goal)}
function showOver(){
  $('ovScore').textContent=G.score;
  $('ovInfo').innerHTML='🪙 +'+G.earned+'<br>'+(G.newRec?'🏆 Novo recorde!':'Recorde: '+S.best)+(claimable()?'<br>🎯 Há desafios para resgatar!':'');
  $('over').style.display='flex';
}

function update(dt){
  G.pops.forEach(p=>p.t+=dt);G.pops=G.pops.filter(p=>p.t<.8);
  if(G.state==='over'){if(G.overT>0&&(G.overT-=dt)<=0)showOver();return}
  if(G.state!=='play')return;
  stepJump(dt);
  if(G.wait>0){G.wait-=dt;return}
  if(G.slowT>0&&(G.slowT-=dt)<=0)endEffect('slow');
  const w=PI2*rps()*(G.slowT>0?CFG.slowMult:1);
  if(G.autoOn&&G.autoLeft>0&&!G.air){
    const ttc=(PI2-phase(G.th))/w;            // tempo até a corda passar pelos pés
    if(ttc<=CFG.jumpDur/2&&ttc>.1){jump();G.autoLeft--}
  }
  const k0=Math.floor((G.th+Math.PI)/PI2);
  G.th+=w*dt;
  const k1=Math.floor((G.th+Math.PI)/PI2);
  if(k1>k0)cross(k1);
}

/* ===== Desenho ===== */
function draw(){
  const c=ctx;c.clearRect(0,0,W,H);
  const gy=H*.72,s=Math.min(W,H)*.14,px=W/2,tm=performance.now()/1000;
  c.fillStyle=FG;
  c.globalAlpha=.07;                          // cenário: morros, nuvens e chão
  c.beginPath();c.ellipse(W*.2,gy,W*.35,H*.14,0,Math.PI,PI2);c.fill();
  c.beginPath();c.ellipse(W*.8,gy,W*.4,H*.2,0,Math.PI,PI2);c.fill();
  for(let i=0;i<3;i++){const x=((i*W*.45+tm*8)%(W+120))-60,y=H*(.12+i*.07);
    c.beginPath();c.ellipse(x,y,36,12,0,0,PI2);c.ellipse(x+22,y-8,22,12,0,0,PI2);c.fill()}
  c.globalAlpha=.16;c.fillRect(0,gy,W,H-gy);
  c.globalAlpha=1;c.fillRect(0,gy,W,2);
  // personagem
  const sk=SKINS[S.skin]||SKINS.default;
  const fy=gy-G.h*s*1.6,st=STYLES.find(x=>x.id===S.style)||STYLES[0],dr=sk.draw||SKINS.default.draw;
  if(G.air&&st.fx){c.save();c.translate(px,fy-s/2);st.fx(c,G.jt,G.jn,s);c.translate(-px,-(fy-s/2));dr(c,px,fy,s,sk);c.restore()}
  else dr(c,px,fy,s,sk);
  // corda
  const hy=gy-s*.5,hx=s*1.1,cs=Math.cos(G.th);
  const ym=hy-(cs>0?s*2.4:s*.5)*cs;
  c.strokeStyle=FG;c.lineWidth=Math.max(3,s*.08);c.lineCap='round';c.lineJoin='round';
  c.beginPath();
  for(let i=0;i<=24;i++){const u=i/24,y=hy+(ym-hy)*(1-Math.pow(Math.abs(2*u-1),2.5));
    i?c.lineTo(px-hx+2*hx*u,y):c.moveTo(px-hx,y)}
  c.stroke();
  c.fillStyle='#ff7a3d';
  [-hx,hx].forEach(d=>{c.beginPath();c.arc(px+d,hy,s*.11,0,PI2);c.fill()});
  // pontos flutuantes
  c.font='bold '+Math.round(s*.4)+'px system-ui';c.textAlign='center';c.fillStyle='#ffb703';
  G.pops.forEach(p=>{c.globalAlpha=1-p.t/.8;c.fillText(p.txt,px,gy-s*2.2-p.t*60)});
  c.globalAlpha=1;
}

  B.w+=m.i;B.vy-=m.u*170;B.sq=1;B.dent=1;B.hy=hy;if(m.tw)B.tw=1;sfx.punch();

  const n=e==='faiscas'?10:e==='estrelas'?6:e==='chamas'?8:0;
  for(let i=0;i<n;i++)B.fx.push({k:e,x,y,t:0,l:.5,vx:e==='chamas'?-Math.random()*60:-(40+Math.random()*160),vy:e==='chamas'?-60-Math.random()*120:(Math.random()-.5)*240});
}
function bupdate(dt){
  B.pops.forEach(p=>p.t+=dt);B.pops=B.pops.filter(p=>p.t<.9).slice(-5);
  B.fx.forEach(f=>{f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt});B.fx=B.fx.filter(f=>f.t<f.l);
  B.an.forEach(a=>{a.t+=dt;if(!a.hit&&a.t>=MOVES[a.k].ht){a.hit=true;impact(a.k)}});B.an=B.an.filter(a=>a.t<MOVES[a.k].d);
  B.w+=(-30*Math.sin(B.a)-2.2*B.w)*dt;B.w=Math.max(-7,Math.min(7,B.w));B.a+=B.w*dt;   // saco como pêndulo
  if(Math.abs(B.a)>1.1){B.a=Math.sign(B.a)*1.1;B.w*=-.3}        // limite de balanço
  B.vy+=(-90*B.y-7*B.vy)*dt;B.y+=B.vy*dt;                     // sobe e desce no gancho
  B.sq=Math.max(0,B.sq-dt*6);B.dent=Math.max(0,B.dent-dt*4);B.tw=Math.max(0,B.tw-dt*2.2);
  B.spin=Math.max(0,B.spin-dt*1.4);B.shake=Math.max(0,B.shake-dt);
  if(B.state==='play'){B.t-=dt;bhud();if(B.t<=0)endBox(false)}
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
// posição da luva em cada golpe (p = 0..1 do golpe). b = dobra do cotovelo (+ para baixo, - para cima)
function glovePos(k,p,rx,ry,tx,ty,s){
  if(k==='gancho'){                              // abaixa, sobe por baixo do saco e volta
    const dx=rx+s*.5,dy=ry+s*1;
    if(p<.28){const e=p/.28;return{x:rx+(dx-rx)*e,y:ry+(dy-ry)*e,b:1}}
    if(p<.5){const e=(p-.28)/.22;return{x:dx+(tx-dx)*e,y:dy+(ty-dy)*e,b:1-.6*e}}
    const e=(p-.5)/.5;return{x:tx+(rx-tx)*e,y:ty+(ry-ty)*e,b:.4+.6*e}
  }
  const f=MOVES[k].ht/MOVES[k].d,e0=p<f?p/f:1-(p-f)/(1-f),e=e0*e0*(3-2*e0);
  const x=rx+(tx-rx)*e,y=ry+(ty-ry)*e,a=Math.sin(Math.PI*e);
  if(k==='cruzado')return{x:x-a*s*.3,y:y-a*s*.9,b:-1};   // arco largo, cotovelo erguido
  return{x,y,b:.15}                                        // jab e direto: braço reto
}
function arm(c,sx,sy,gx,gy,b,L){
  const dx=gx-sx,dy=gy-sy,d=Math.hypot(dx,dy)||1,hh=Math.sqrt(Math.max(0,L*L-d*d/4));
  const ex=(sx+gx)/2-dy/d*hh*b,ey=(sy+gy)/2+dx/d*hh*b;
  c.beginPath();c.moveTo(sx,sy);c.lineTo(ex,ey);c.lineTo(gx,gy);c.stroke();
}
function bdraw(){
  const c=bctx,g=bgeo(),s=Math.min(BW,BH)*.16,gy=BH*.84,bx=BW*.24,w=g.w,h=g.h,top=g.y-g.py+B.y;
  c.clearRect(0,0,BW,BH);c.save();
  if(B.shake>0)c.translate((Math.random()-.5)*B.shake*36,(Math.random()-.5)*B.shake*36);
  c.fillStyle=FG;c.globalAlpha=.16;c.fillRect(0,gy,BW,BH-gy);
  c.globalAlpha=.12;c.beginPath();c.ellipse(g.x+Math.sin(B.a)*BH*.45,gy+5,w*.7,6,0,0,PI2);c.fill();   // sombra do saco
  c.globalAlpha=1;c.fillRect(0,gy,BW,2);
  // lutador: o corpo acompanha o golpe
  const sk=SKINS[S.skin]||SKINS.default,ba=B.an[B.an.length-1],bp=ba?ba.t/MOVES[ba.k].d:0,ev=Math.sin(Math.PI*bp);
  c.save();c.translate(bx,gy);
  if(ba){if(ba.k==='direto')c.rotate(.16*ev);else if(ba.k==='jab')c.rotate(.05*ev);
    else if(ba.k==='cruzado'){c.rotate(-.1*ev);c.scale(1-.12*ev,1)}else c.scale(1,1-.16*Math.sin(Math.PI*Math.min(1,bp*2)))}
  (sk.draw||SKINS.default.draw)(c,0,0,s,sk);c.restore();
  const gl=bxEq('gl')[2];
  for(let hd=0;hd<2;hd++){
    const sx=bx+s*.4,sy=gy-s*(.72-.12*hd),rx=sx+s*.45,ry=sy+s*.1,a=B.an.filter(q=>(q.k==='jab'||q.k==='cruzado'?0:1)===hd).pop();
    let gp={x:rx,y:ry,b:.15};
    if(a){const tx=g.x-w/2-s*.25,ty=g.y+h*(a.k==='gancho'?.8:.45);gp=glovePos(a.k,a.t/MOVES[a.k].d,rx,ry,tx,ty,s)}
    c.strokeStyle=sk.color;c.lineWidth=s*.16;c.lineCap='round';c.lineJoin='round';arm(c,sx,sy,gp.x,gp.y,gp.b,s*.65);
    c.fillStyle=gl;c.beginPath();c.arc(gp.x,gp.y,s*.3,0,PI2);c.fill();c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=2;c.stroke();
    c.fillStyle='rgba(255,255,255,.3)';c.beginPath();c.arc(gp.x-s*.08,gp.y-s*.1,s*.09,0,PI2);c.fill();
  }
  // saco: correntes em V, corpo com volume, costuras, marca do impacto
  const bg=bxEq('bag');
  c.save();c.translate(g.x,g.py);c.rotate(B.a);
  c.strokeStyle=FG;c.lineWidth=2.5;c.beginPath();c.moveTo(0,0);c.lineTo(-w*.32,top);c.moveTo(0,0);c.lineTo(w*.32,top);c.stroke();
  c.translate(0,top+h/2);
  c.scale((1-.15*B.sq)*(B.spin>0?Math.cos((1-B.spin)*PI2*2):1)*(1-.2*B.tw*Math.abs(Math.sin(B.tw*10))),1+.05*B.sq);
  c.fillStyle=bg[2];rr(c,-w/2,-h/2,w,h,w*.28);c.fill();
  const gr=c.createLinearGradient(-w/2,0,w/2,0);gr.addColorStop(0,'rgba(255,255,255,.3)');gr.addColorStop(.5,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(0,0,0,.35)');
  c.fillStyle=gr;rr(c,-w/2,-h/2,w,h,w*.28);c.fill();
  c.fillStyle='rgba(0,0,0,.25)';c.fillRect(-w/2,-h/2+h*.07,w,h*.07);c.fillRect(-w/2,h/2-h*.14,w,h*.07);
  c.strokeStyle='rgba(0,0,0,.2)';c.lineWidth=1;[.3,.5,.7].forEach(f=>{c.beginPath();c.moveTo(-w/2,-h/2+h*f);c.lineTo(w/2,-h/2+h*f);c.stroke()});
  if(bg[4]==='s'){c.fillStyle='rgba(255,255,255,.35)';[.3,.5,.7].forEach(f=>c.fillRect(-w/2,-h/2+h*f,w,h*.05))}
  if(bg[4]==='*'){c.fillStyle='#fde68a';c.font=Math.round(w*.35)+'px system-ui';c.textAlign='center';c.fillText('★',0,-h*.2);c.fillText('★',-w*.2,h*.05);c.fillText('★',w*.2,h*.25)}
  if(bg[4]==='g'){c.fillStyle='rgba(255,255,255,.4)';c.fillRect(-w*.3,-h*.4,w*.1,h*.8)}
  if(B.dent>0){c.fillStyle='rgba(0,0,0,'+(.3*B.dent)+')';c.beginPath();c.ellipse(-w/2+3,(B.hy-.5)*h,w*.2*B.dent,h*.1,0,0,PI2);c.fill()}
  c.restore();
  B.fx.forEach(f=>{const p=f.t/f.l;c.globalAlpha=1-p;
    if(f.k==='ring'){c.strokeStyle='#fff';c.lineWidth=3;c.beginPath();c.arc(f.x,f.y,8+p*s*.9,0,PI2);c.stroke()}
    else if(f.k==='faiscas'){c.strokeStyle='#fde047';c.lineWidth=3;c.beginPath();c.moveTo(f.x,f.y);c.lineTo(f.x-f.vx*.05,f.y-f.vy*.05);c.stroke()}
    else if(f.k==='estrelas'){c.fillStyle='#fde047';c.font='20px system-ui';c.textAlign='center';c.fillText('★',f.x,f.y)}
    else{c.fillStyle=p<.5?'#f97316':'#ef4444';c.beginPath();c.arc(f.x,f.y,10*(1-p),0,PI2);c.fill()}});
  B.pops.forEach(p=>{c.globalAlpha=Math.max(0,1-p.t/.9);c.textAlign='center';c.font='bold '+Math.round(s*(p.big?.34:.26))+'px system-ui';
    c.fillStyle=p.big?'#ffb703':FG;c.fillText(p.txt,p.big?BW/2:g.x-g.w,p.big?BH*.1-p.t*20:g.y-p.t*40)});
  c.globalAlpha=1;c.restore();
}
function bloop(t){if(!B.on)return;const dt=Math.min((t-B.last)/1000||0,.05);B.last=t;bupdate(dt);bdraw();B.raf=requestAnimationFrame(bloop)}
function endBox(quit){
  if(B.state==='over')return;
  B.state='over';
  if(B.n>S.bxBest){S.bxBest=B.n;B.newRec=true}
  save();
  if(quit)return;
  $('bover').innerHTML='<h2 style="flex:none">Tempo!</h2><div class="big">'+B.n+' socos</div><div>🪙 +'+B.earned+' · 🔥 '+B.combos+' combos<br>'+(B.newRec?'🏆 Novo recorde!':'Recorde: '+S.bxBest)+'<br>Total de socos: '+S.bxTotal+'</div><button class="pri" id="bagain">Treinar de novo</button><button data-go="bshop">🛒 Equipamentos</button><button data-go="menu">Menu</button>';
  $('bagain').onclick=startBox;$('bover').style.display='flex';
}
function renderBshop(){
  $('bsCoins').textContent='🪙 '+S.coins;
  const L=S.bxPow,mx=L>=BX.pcost.length;
  let o='<h3>Força do soco</h3><div class="card"><div class="t"><b>Nível '+L+'/'+BX.pcost.length+'</b><small>🪙 '+bxCoins()+' por soco'+(mx?'':' → '+BX.base[L+1])+'</small></div><button class="pri" data-bxp="1"'+(mx||S.coins<BX.pcost[L]?' disabled':'')+'>'+(mx?'Máximo':'🪙 '+BX.pcost[L])+'</button></div>';
  Object.keys(BCAT).forEach(cat=>{o+='<h3>'+BCAT[cat]+'</h3>'+BX[cat].map(it=>{
    const id=it[0],pr=bxPrice(cat,it),own=bxOwn(cat,it),eq=S.bxEq[cat]===id;
    const dot=(cat==='gl'||cat==='bag')?'<span style="display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:middle;margin-right:8px;background:'+it[2]+'"></span>':'';
    const btn=eq?'<button disabled>Em uso</button>':own?'<button class="pri" data-bxe="'+cat+':'+id+'">Usar</button>':'<button class="pri" data-bxb="'+cat+':'+id+'"'+(S.coins<pr?' disabled':'')+'>🪙 '+pr+'</button>';
    return '<div class="card"><div class="t">'+dot+'<b>'+it[1]+'</b></div>'+btn+'</div>'}).join('')});
  $('bsList').innerHTML=o;
}
function bxPower(){const c=BX.pcost[S.bxPow];if(c&&S.coins>=c){S.coins-=c;S.bxPow++;save();sfx.buy();renderBshop()}}
function bxFind(a){const p=a.split(':'),it=BX[p[0]]&&BX[p[0]].find(x=>x[0]===p[1]);return it?{cat:p[0],it:it}:null}
function bxBuy(a){const f=bxFind(a);if(!f||bxOwn(f.cat,f.it))return;const pr=bxPrice(f.cat,f.it);
  if(S.coins<pr)return;S.coins-=pr;S.bxOwn[f.cat+':'+f.it[0]]=1;S.bxEq[f.cat]=f.it[0];save();sfx.buy();renderBshop()}
function bxEquip(a){const f=bxFind(a);if(f&&bxOwn(f.cat,f.it)){S.bxEq[f.cat]=f.it[0];save();renderBshop()}}

/* ===== Eventos ===== */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.go){if(G.on&&G.state==='play')finish(true);go(b.dataset.go)}
  else if(b.dataset.buy)buy(b.dataset.buy);
  else if(b.dataset.claim)claim(b.dataset.claim);
  else if(b.dataset.bg)bgPickC(b.dataset.bg);
  else if(b.dataset.skin)skinPick(b.dataset.skin);
  else if(b.dataset.style){const x=STYLES.find(y=>y.id===b.dataset.style);if(x&&S.total>=x.at){S.style=x.id;save();renderSet()}}
  else if(b.dataset.bxp)bxPower();
  else if(b.dataset.bxb)bxBuy(b.dataset.bxb);
  else if(b.dataset.bxe)bxEquip(b.dataset.bxe);
});
$('again').onclick=startRound;
$('bSlow').onclick=useSlow;
$('bAuto').onclick=useAuto;
$('bQuit').onclick=()=>{if(G.state==='play')finish(true);go('menu')};
$('sndBtn').onclick=()=>{S.sound=!S.sound;save();renderSet();sfx.buy()};
$('skinAdd').onclick=()=>{if(S.coins<IMGP){toast('Faltam '+(IMGP-S.coins)+' moedas');return}ask('Adicionar uma skin própria custa '+IMGP+' moedas. Continuar?',()=>$('skinIn').click())};
$('skinIn').onchange=e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  if(S.custom.length>=10){toast('Limite de 10 skins. Remova uma antes.');return}
  if(S.coins<IMGP){toast('Faltam '+(IMGP-S.coins)+' moedas');return}
  const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{
    const c=document.createElement('canvas'),mx=Math.max(im.width,im.height),px=mx<=128,k=px?1:Math.min(1,256/mx);
    c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);   // imagens até 128px são tratadas como pixel art
    URL.revokeObjectURL(u);
    const sk={id:'c'+Date.now(),name:'Skin '+(S.custom.length+1),img:c.toDataURL('image/png'),pixel:px};
    S.custom.push(sk);S.coins-=IMGP;S.own['skin:'+sk.id]=1;regCustom(sk);S.skin=sk.id;save();renderSet();toast('Skin adicionada!');
  };
  im.onerror=()=>toast('Não consegui abrir essa imagem');
  im.src=u;
};
$('skinDel').onclick=()=>{
  const id=S.skin;if(!SKINS[id]||!SKINS[id].custom)return;
  ask('Remover esta skin do aparelho?',()=>{
    S.custom=S.custom.filter(c=>c.id!==id);delete SKINS[id];S.skin='default';save();renderSet();
  });
};
$('bgIn').oninput=e=>setBg(e.target.value);
$('bgPick').onclick=()=>{if(S.own.picker)$('bgIn').click();else purchase('picker',PICKP,'a cor livre',()=>{renderSet();$('bgIn').click()})};
cv=$('cv');ctx=cv.getContext('2d');
bcv=$('bv');bctx=bcv.getContext('2d');
document.querySelectorAll('[data-mv]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();punch(b.dataset.mv)}));
$('bbQuit').onclick=()=>{endBox(true);go('menu')};
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap()});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();tap()}});
window.addEventListener('resize',()=>{if(G.on)resize();if(B.on)bres()});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&G.on&&G.state==='play'){G.paused=true;setMsg('Pausado. Toque para continuar')}
});

applyTheme();renderMenu();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
